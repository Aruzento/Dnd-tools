<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>Персонажи — Tools</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    .character-tool {
      display: grid;
      gap: 18px;
    }

    .character-toolbar {
      display: grid;
      gap: 8px;
    }

    .character-toolbar label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .character-select {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      color: var(--text);
      background: var(--surface-deep);
      font: inherit;
      cursor: pointer;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .character-select:focus {
      border-color: #6d6d6d;
      box-shadow: 0 0 0 2px rgba(255,255,255,.06);
    }

    .character-sheet {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .character-sheet h1 {
      margin: 0 0 12px;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.12;
      font-weight: 600;
      letter-spacing: -.03em;
    }

    .character-sheet h2 {
      margin: 28px 0 10px;
      font-size: 19px;
    }

    .character-sheet p,
    .character-sheet li {
      color: #dedede;
      line-height: 1.62;
    }

    .character-sheet p {
      margin: 10px 0;
    }

    .character-sheet ul {
      margin: 10px 0 18px;
      padding-left: 22px;
    }

    .character-sheet li {
      margin: 8px 0;
    }

    .character-sheet strong {
      color: var(--text);
    }

    .character-sheet em {
      color: var(--muted);
    }

    .character-sheet code {
      padding: 2px 5px;
      border-radius: 6px;
      background: var(--surface-deep);
    }

    .character-source {
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid var(--border-soft);
      color: var(--muted-2);
      font-size: 12px;
    }

    .character-empty {
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .character-sheet {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="tool-1.html" aria-label="Tools — главная">TOOLS</a>
    <nav class="tool-nav" aria-label="Инструменты">
      <a class="nav-link" href="tool-1.html">Генератор лута</a>
      <a class="nav-link" href="tool-2.html">Конвертер денег</a>
      <a class="nav-link" href="tool-3.html">Калькулятор</a>
      <a class="nav-link active" href="tool-4.html" aria-current="page">Персонажи</a>
      <a class="nav-link" href="tool-5.html">Магазин</a>
    </nav>
  </div>
</header>

<main class="page-shell character-page">
  <section class="page-heading">
    <p class="kicker">Инструмент 4</p>
    <h1>Персонажи</h1>
    <p class="subtitle">Карточки автоматически собираются из content/characters/*.md.</p>
  </section>

  <div class="character-tool">
    <div class="character-toolbar">
      <label for="characterSelect">Персонаж</label>
      <select id="characterSelect" class="character-select" aria-label="Выберите персонажа"></select>
    </div>

    <article id="characterSheet" class="character-sheet"></article>
  </div>
</main>

<script src="../data/characters-data.js"></script>
<script>
  const characters = Array.isArray(window.CHARACTERS)
    ? window.CHARACTERS
    : [];

  const select = document.getElementById("characterSelect");
  const sheet = document.getElementById("characterSheet");

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function inlineMarkdown(text) {
    let result = escapeHtml(text);
    result = result.replace(/`([^`]+)`/g, "<code>$1</code>");
    result = result.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    result = result.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    return result;
  }

  function markdownToHtml(md) {
    const lines = String(md || "").replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let inList = false;
    let paragraph = [];

    const flushParagraph = () => {
      if (!paragraph.length) return;
      out.push("<p>" + paragraph.map(inlineMarkdown).join("<br>") + "</p>");
      paragraph = [];
    };

    const closeList = () => {
      if (!inList) return;
      out.push("</ul>");
      inList = false;
    };

    for (const raw of lines) {
      const line = raw.trimEnd();

      if (!line.trim()) {
        flushParagraph();
        closeList();
        continue;
      }

      if (line.startsWith("# ")) {
        flushParagraph();
        closeList();
        out.push("<h1>" + inlineMarkdown(line.slice(2).trim()) + "</h1>");
        continue;
      }

      if (line.startsWith("## ")) {
        flushParagraph();
        closeList();
        out.push("<h2>" + inlineMarkdown(line.slice(3).trim()) + "</h2>");
        continue;
      }

      if (/^\s*-\s+/.test(raw)) {
        flushParagraph();

        if (!inList) {
          out.push("<ul>");
          inList = true;
        }

        out.push("<li>" + inlineMarkdown(raw.replace(/^\s*-\s+/, "")) + "</li>");
        continue;
      }

      paragraph.push(line.trim());
    }

    flushParagraph();
    closeList();
    return out.join("");
  }

  function renderCharacter(index) {
    const character = characters[index];

    if (!character) {
      sheet.innerHTML = '<p class="character-empty">Нет доступных персонажей. Запустите Update and launch.bat.</p>';
      return;
    }

    sheet.innerHTML =
      markdownToHtml(character.markdown) +
      '<div class="character-source">Источник: content/characters/' +
      escapeHtml(character.file) +
      "</div>";
  }

  if (!characters.length) {
    select.disabled = true;
    renderCharacter(-1);
  } else {
    characters.forEach((character, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = character.name;
      select.appendChild(option);
    });

    select.addEventListener("change", () => {
      renderCharacter(Number(select.value));
    });

    renderCharacter(0);
  }
</script>
</body>
</html>
