  <link rel="stylesheet" href="../assets/css/styles.css">
<style>
.character-tool {
  display: grid;
  gap: 18px;
}

.character-toolbar {
  display: grid;
  gap: 8px;
}

.character-toolbar label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}

.character-select {
  width: 100%;
  height: 46px;
  padding: 0 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  color: var(--text);
  background: var(--surface-deep);
  font: inherit;
  cursor: pointer;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}

.character-select:focus {
  border-color: #6d6d6d;
  box-shadow: 0 0 0 2px rgba(255,255,255,.06);
}

.character-sheet {
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.character-sheet h1 {
  margin: 0 0 12px;
  font-size: clamp(26px, 4vw, 38px);
  line-height: 1.12;
  font-weight: 600;
  letter-spacing: -.03em;
}

.character-sheet h2 {
  margin: 28px 0 10px;
  font-size: 19px;
}

.character-sheet p,
.character-sheet li {
  color: #dedede;
  line-height: 1.62;
}

.character-sheet p {
  margin: 10px 0;
}

.character-sheet ul {
  margin: 10px 0 18px;
  padding-left: 22px;
}

.character-sheet li {
  margin: 8px 0;
}

.character-sheet strong {
  color: var(--text);
}

.character-sheet em {
  color: var(--muted);
}

.character-sheet code {
  padding: 2px 5px;
  border-radius: 6px;
  background: var(--surface-deep);
}

.character-source {
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px solid var(--border-soft);
  color: var(--muted-2);
  font-size: 12px;
}

@media (max-width: 640px) {
  .character-sheet {
    padding: 18px;
  }
}
</style>
</head>

  <script>
    const characters = [{"name": "Лазарь", "title": "Бард Лазарь — Коллегия Очарования", "markdown": "# Бард Лазарь — Коллегия Очарования\n**Раса:** полуэльф · **Хиты:** 18 · **КД:** 14 · **Бонус мастерства:** +2\n\n## Умения и способности\n- **Полуэльф:** тёмное зрение 60 фт.; преимущество против очарования, магия не усыпляет; владение 2 навыками на выбор.\n- **Бардовское вдохновение d6:** бонусным действием союзнику в 60 фт.; применений = мод. Харизмы, восстановление после долгого отдыха.\n- **Мастер на все руки:** +1 к проверкам характеристик, где не применяется бонус мастерства.\n- **Песнь отдыха d6:** +1d6 лечения при коротком отдыхе с тратой Кости Хитов.\n- **Экспертиза:** удвоенный бонус мастерства для 2 выбранных владений.\n- **Мантия вдохновения:** бонусное действие + 1 Бардовское вдохновение; до мод. Харизмы существ в 60 фт. получают 5 временных хитов и могут реакцией переместиться на свою скорость без провоцирования атак.\n- **Завораживающее выступление:** после 1 мин. выступления до мод. Харизмы гуманоидов в 60 фт.; Спасбросок Мудрости или очарованы до 1 ч.; 1/короткий или долгий отдых.\n\n**Инструменты:** 3 музыкальных инструмента на выбор.\n\n## Заклинания\n**Ячейки:** 1 ур. ×4 · 2 ур. ×2  \nВ = вербальный · С = соматический · М = материальный.\n\n- **Дружба** — заговор · С, М (немного косметики).\n- **Злая насмешка** — заговор · В.\n- **Искусная острота** — 1 ур. · В.\n- **Лечащее слово** — 1 ур. · В.\n- **Невидимый слуга** — 1 ур. · В, С, М (нитка и кусочек дерева) · ритуал.\n- **Порча** — 1 ур. · В, С, М (капля крови).\n- **Усыпление** — 1 ур. · В, С, М (щепоть мелкого песка, лепестки роз или сверчок).\n- **Удержание личности** — 2 ур. · В, С, М (маленький прямой кусочек железа).\n\n*Источники правил: PHB 2014; Xanathar’s Guide to Everything; Strixhaven: A Curriculum of Chaos.*\n", "file": "01_Бард_Коллегия_Очарования.md"}, {"name": "Азраэль", "title": "Плут Азраэль — Убийца", "markdown": "# Плут Азраэль — Убийца\n**Раса:** тифлинг · **Хиты:** 15 · **КД:** 13 · **Бонус мастерства:** +2\n\n## Умения и способности\n- **Тифлинг:** тёмное зрение 60 фт.; сопротивление огню; «Чудотворство»; с 3 уровня «Адское возмездие» 1/долгий отдых, сотворяется как заклинание 2 уровня (Харизма).\n- **Экспертиза:** удвоенный бонус мастерства для 2 выбранных владений.\n- **Скрытая атака:** +2d6 1/ход при выполнении условий.\n- **Хитрое действие:** бонусным действием Рывок, Отход или Спрятаться.\n- **Дополнительные владения убийцы:** набор для грима и набор отравителя.\n- **Ликвидация:** преимущество на атаки по существам, которые ещё не ходили; попадание по застигнутому врасплох существу — критическое.\n\n**Инструменты:** воровские инструменты; набор для грима; набор отравителя.\n\n## Заклинания\nВ = вербальный · С = соматический · М = материальный.\n\n- **Чудотворство** — заговор · В.\n- **Адское возмездие** — 1 ур. · В, С · расово: 1/долгий отдых, сотворяется как **2 ур.**, без ячейки.\n\n*Источники правил: PHB 2014.*\n", "file": "02_Плут_Убийца.md"}, {"name": "Фредо", "title": "Друид Фредо — Круг Земли (Лес)", "markdown": "# Друид Фредо — Круг Земли (Лес)\n**Раса:** тифлинг · **Хиты:** 24 · **КД:** 12 · **Бонус мастерства:** +2\n\n## Умения и способности\n- **Тифлинг:** тёмное зрение 60 фт.; сопротивление огню; «Чудотворство»; с 3 уровня «Адское возмездие» 1/долгий отдых, как заклинание 2 уровня (Харизма).\n- **Дикий облик:** 2/короткий или долгий отдых; зверь до КС 1/4, без скорости плавания/полёта; до 1 часа.\n- **Круг Земли:** 1 дополнительный заговор друида.\n- **Естественное восстановление:** 1/долгий отдых после короткого отдыха восстановить ячейки суммарно до 2 уровней.\n- **Заклинания круга — Лес:** «Дубовая кора» и «Паук» всегда подготовлены и не входят в лимит подготовки.\n\n**Инструменты:** набор травника.\n\n## Заклинания\n**Ячейки:** 1 ур. ×4 · 2 ур. ×2  \nВ = вербальный · С = соматический · М = материальный.\n\n- **Искусство друидов** — заговор · В, С.\n- **Починка** — заговор · В, С, М (два магнетита).\n- **Сотворение пламени** — заговор · В, С.\n- **Чудотворство** — заговор · В.\n- **Лечение ран** — 1 ур. · В, С.\n- **Огонь фей** — 1 ур. · В.\n- **Разговор с животными** — 1 ур. · В, С · ритуал.\n- **Адское возмездие** — 1 ур. · В, С · расово: 1/долгий отдых как **2 ур.**, без ячейки.\n- **Горящий клинок** — 2 ур. · В, С, М (лист сумаха) · концентрация.\n- **Дубовая кора** — 2 ур. · В, С, М (горсть дубовой коры) · концентрация.\n- **Паук** — 2 ур. · В, С, М (капля битума и паук) · концентрация.\n- **Поиск ловушек** — 2 ур. · В, С.\n\n*Источники правил: PHB 2014.*\n", "file": "03_Друид_Круг_Земли.md"}, {"name": "Марфа", "title": "Чародей Марфа — Наследие драконьей крови", "markdown": "# Чародей Марфа — Наследие драконьей крови\n**Раса:** полуорк · **Хиты:** 23 · **КД:** 14 · **Бонус мастерства:** +2\n\n## Умения и способности\n- **Полуорк:** тёмное зрение 60 фт.; владение Запугиванием; **Непоколебимая стойкость** — вместо падения до 0 хитов остаться на 1, 1/долгий отдых; **Свирепые атаки** — при крите рукопашным оружием +1 кость урона оружия.\n- **Единицы чародейства:** 3; гибкое заклинательство — преобразование ячеек ↔ единицы чародейства.\n- **Метамагия:** **Далёкое заклинание** и **Неуловимое заклинание**.\n- **Драконий предок:** зелёный дракон; связанный тип урона — яд; при подходящих проверках Харизмы против драконов применимый бонус мастерства удваивается.\n- **Драконья устойчивость:** +1 максимум хитов за каждый уровень чародея; без доспеха КД = 13 + Ловкость.\n\n**Инструменты:** нет от расы/класса/подкласса.\n\n## Заклинания\n**Ячейки:** 1 ур. ×4 · 2 ур. ×2  \nВ = вербальный · С = соматический · М = материальный.\n\n- **Брызги яда** — заговор · В, С.\n- **Магическая рука** — заговор · В, С.\n- **Свет** — заговор · В, М (светлячок или фосфоресцирующий мох).\n- **Шоковое прикосновение** — заговор · В, С.\n- **Волшебная стрела** — 1 ур. · В, С.\n- **Луч болезни** — 1 ур. · В, С.\n- **Обнаружение магии** — 1 ур. · В, С · ритуал.\n- **Дыхание дракона** — 2 ур. · В, С, М (острый перец) · концентрация.\n\n*Источники правил: PHB 2014; Xanathar’s Guide to Everything.*\n", "file": "04_Чародей_Драконья_Кровь.md"}, {"name": "Ренкай", "title": "Воин Ренкай — Воин Эха", "markdown": "# Воин Ренкай — Воин Эха\n**Раса:** человек · **Ликантропия:** вермедведь · **Хиты:** 31 · **КД:** 19 · **Бонус мастерства:** +2\n\n## Умения и способности\n- **Человек (стандартный):** все характеристики +1.\n- **Боевой стиль:** 1 стиль на выбор (конкретный не указан).\n- **Второе дыхание:** бонусным действием восстановить 1d10 + 3 хита; 1/короткий или долгий отдых.\n- **Всплеск действий:** дополнительное действие в свой ход; 1/короткий или долгий отдых.\n- **Воплощение эха:** бонусным действием создать эхо в 15 фт.; КД эха = 14 + БМ (**16**), 1 хит, иммунитет ко всем состояниям. Эхо двигается до 30 фт. без действия; атаки действием Атака могут исходить из вашей клетки или клетки эха; из эха можно совершать провоцированные атаки; бонусным действием можно поменяться с ним местами, потратив 15 фт. перемещения.\n- **Высвобождение воплощения:** при действии Атака сделать ещё 1 рукопашную атаку из позиции эха; использований = мод. Телосложения (мин. 1), восстановление после долгого отдыха.\n- **Вермедведь:** Сила становится 19, если была ниже; в форме медведя/гибрида **КД +1** (при указанном КД 19 → 20), скорость 40 фт. и лазание 30 фт.; иммунитет к дробящему/колющему/рубящему урону от немагических несеребряных атак; преимущество Восприятия по запаху; превращение действием в медведя/гибрида и обратно. Получает натуральные атаки вермедведя и владение ими: **укус 2d10 + Сила**, **когти 2d8 + Сила**. СЛ заражения укусом = 8 + БМ + мод. Телосложения.\n\n**Инструменты:** нет от расы/класса/подкласса/ликантропии.\n\n## Заклинания\nНет.\n\n*Источники правил: PHB 2014; Explorer’s Guide to Wildemount; Monster Manual 2014.*\n", "file": "05_Воин_Эха_Вермедведь.md"}, {"name": "Громм", "title": "Варвар \"Громм\" — Путь Зверя", "markdown": "# Варвар \"Громм\" — Путь Зверя\n**Раса:** дварф · **Хиты:** 35 · **КД:** 15 · **Бонус мастерства:** +2\n\n## Умения и способности\n- **Дварф:** тёмное зрение 60 фт.; преимущество спасбросков против яда и сопротивление урону ядом; владение боевым топором, ручным топором, лёгким молотом и боевым молотом; **Знание камня** — для Истории о каменной кладке считается владеющим навыком и удваивает БМ; скорость 25 фт., тяжёлый доспех её не снижает.\n- **Подраса дварфа не указана:** её особенности не добавлены.\n- **Ярость:** 3/долгий отдых; +2 урона рукопашными атаками Силой, преимущество проверок/спасбросков Силы, сопротивление дробящему/колющему/рубящему урону.\n- **Защита без доспехов:** КД = 10 + Ловкость + Телосложение.\n- **Безрассудная атака:** преимущество рукопашных атак Силой в этот ход; атаки по вам получают преимущество до следующего хода.\n- **Чувство опасности:** преимущество спасбросков Ловкости против видимых эффектов, если не ослеплён/оглушён/недееспособен.\n- **Форма зверя:** при входе в Ярость выбрать натуральное оружие:\n  - **Укус:** 1d8 колющего; 1/ход при хитов меньше половины после попадания восстановить хиты = БМ (**2**).\n  - **Когти:** 1d6 рубящего; 1/ход после атаки когтем действием Атака — ещё 1 атака когтем тем же действием.\n  - **Хвост:** 1d8 колющего, досягаемость; реакцией при попадании по вам бросить d8 и добавить к КД против этой атаки.\n\n**Инструменты:** 1 на выбор — инструменты кузнеца, припасы пивовара или инструменты каменщика.\n\n## Заклинания\nНет.\n\n*Источники правил: PHB 2014; Tasha’s Cauldron of Everything.*\n", "file": "06_Варвар_Путь_Зверя.md"}];

    const select = document.getElementById("characterSelect");
    const sheet = document.getElementById("characterSheet");

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function inlineMarkdown(text) {
      let result = escapeHtml(text);
      result = result.replace(/`([^`]+)`/g, "<code>$1</code>");
      result = result.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      result = result.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return result;
    }

    function markdownToHtml(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let inList = false;
      let paragraph = [];

      const flushParagraph = () => {
        if (paragraph.length) {
          out.push("<p>" + paragraph.map(inlineMarkdown).join("<br>") + "</p>");
          paragraph = [];
        }
      };

      const closeList = () => {
        if (inList) {
          out.push("</ul>");
          inList = false;
        }
      };

      for (const raw of lines) {
        const line = raw.trimEnd();

        if (!line.trim()) {
          flushParagraph();
          closeList();
          continue;
        }

        if (line.startsWith("# ")) {
          flushParagraph();
          closeList();
          out.push("<h1>" + inlineMarkdown(line.slice(2).trim()) + "</h1>");
          continue;
        }

        if (line.startsWith("## ")) {
          flushParagraph();
          closeList();
          out.push("<h2>" + inlineMarkdown(line.slice(3).trim()) + "</h2>");
          continue;
        }

        if (line.startsWith("- ")) {
          flushParagraph();
          if (!inList) {
            out.push("<ul>");
            inList = true;
          }
          out.push("<li>" + inlineMarkdown(line.slice(2).trim()) + "</li>");
          continue;
        }

        // Nested list line from source MD.
        if (/^\s{2,}-\s/.test(raw)) {
          flushParagraph();
          if (!inList) {
            out.push("<ul>");
            inList = true;
          }
          out.push("<li>" + inlineMarkdown(raw.replace(/^\s*-\s*/, "")) + "</li>");
          continue;
        }

        paragraph.push(line.trim());
      }

      flushParagraph();
      closeList();
      return out.join("");
    }

    function renderCharacter(index) {
      const character = characters[index];
      sheet.innerHTML =
        markdownToHtml(character.markdown) +
        '<div class="character-source">Источник: ' + escapeHtml(character.file) + "</div>";
    }

    characters.forEach((character, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = character.name;
      select.appendChild(option);
    });

    select.addEventListener("change", () => renderCharacter(Number(select.value)));
    renderCharacter(0);
  </script>
</body>
</html>
