<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>Магазин — Tools</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="tool-1.html" aria-label="Tools — главная">TOOLS</a>
    <nav class="tool-nav" aria-label="Инструменты">
      <a class="nav-link" href="tool-1.html">Генератор лута</a>
      <a class="nav-link" href="tool-2.html">Конвертер денег</a>
      <a class="nav-link" href="tool-3.html">Калькулятор</a>
      <a class="nav-link" href="tool-4.html">Персонажи</a>
      <a class="nav-link active" href="tool-5.html" aria-current="page">Магазин</a>
    </nav>
  </div>
</header>

<main class="page-shell shop-shell">
  <section class="page-heading shop-heading">
    <div>
      <p class="kicker">Инструмент 5</p>
      <h1>Магазин</h1>
      <p class="subtitle">Выберите категорию и сгенерируйте случайный ассортимент магазина.</p>
    </div>
  </section>

  <section class="shop-controls" aria-label="Настройки магазина">
    <label class="field shop-category-field">
      <span>Категория магазина</span>
      <select id="shop-category" class="shop-select" aria-label="Категория магазина"></select>
    </label>
    <button class="generate-button shop-refresh" id="shop-refresh" type="button">Обновить магазин</button>
  </section>

  <div class="shop-summary" id="shop-summary" aria-live="polite"></div>
  <p class="form-error shop-error" id="shop-error" role="alert" aria-live="polite"></p>

  <section class="shop-list" id="shop-list" aria-label="Ассортимент магазина"></section>
</main>

<template id="shop-item-template">
  <article class="shop-item">
    <div class="shop-item-main">
      <h2 class="shop-item-name"></h2>
      <p class="shop-item-description"></p>
    </div>
    <div class="shop-item-price-wrap">
      <span>Цена продажи</span>
      <strong class="shop-item-price"></strong>
    </div>
  </article>
</template>

<script src="../data/loot-data.js"></script>
<script src="../assets/js/shop.js"></script>
</body>
</html>
